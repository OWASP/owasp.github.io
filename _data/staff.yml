- image: /people/staff_missie.jpg
  name: Missie Lindsey
  title: Director of Corporate Relations
  location: Louisiana, United States
  email: missie.lindsey@owasp.com
  description: The Director of Corporate Relations connects with OWASP’s existing corporate supporters and partners, identifying new strategic alliance opportunities, and building out the infrastructure to support a growing portfolio of corporate relationships aligned with OWASP’s mission to improve software security worldwide.
- image: /people/staff_lauren.jpg
  name: Lauren Thomas
  title: Director of Events
  location: Florida, United States
  email: lauren.thomas@owasp.com
  description: The Director of Events is responsible for planning and delivering events for our global community. This position is the go-to person for the community, staff, and vendors and will coordinate event details from a big-picture viewpoint to create the overall experiences for attendees, exhibitors, sponsors, and vendors.
- image: /people/staff-starr-brown.jpeg
  name: Starr Brown 
  title: Director of Open Source Projects & Programs
  location: Georgia, United States
  email: starr.brown@owasp.com 
  description: The Director of Open Source Projects & Programs provides strategic leadership and operational oversight for OWASP’s open source initiatives—ensuring community contributors are supported through structured programs, resource allocation, and sustainable funding mechanisms that maximize impact and advance the foundation’s mission.
- image: /people/heather_photo.jpeg
  name: Heather Kennedy
  title: Senior Events Manager
  location: Louisiana, United States
  email: heather.kennedy@owasp.com
  description: The Senior Events Manager assists the Director of Events in planning and delivering events for our global community. This role involves coordinating logistics, managing budgets, and collaborating with vendors and team members to ensure events run smoothly.
- image: /people/staff_stacey.jpg
  name: Stacey Ebbs
  title: Marketing and Communications Manager
  location: United Kingdom
  email: stacey.ebbs@owasp.com
  description: The Marketing and Communications Manager runs all of the Foundation's Marketing and Communications strategies, responsible for such items as the annual Impact Report, promoting OWASP initiatives, projects, events, and other activities on social media and elsewhere, and helping to manage the OWASP social media spaces, such as Slack and elsewhere.
  






